<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Top-down (axial) brain silhouette. Front (frontal lobe) at top (-y), back (occipital) at bottom (+y).
       Translucent indigo so it reads as a faint outline behind the force-directed graph. -->
  <path d="M 0,-92 C 38,-92 70,-72 82,-40 C 92,-12 90,22 78,52 C 64,80 36,92 0,92 C -36,92 -64,80 -78,52 C -90,22 -92,-12 -82,-40 C -70,-72 -38,-92 0,-92 Z"
        fill="#6366f1" fill-opacity="0.06" stroke-opacity="0.55"/>
  <!-- Longitudinal fissure (divides left + right hemispheres) -->
  <path d="M 0,-90 C 4,-50 -4,0 0,40 C 3,65 -2,80 0,90" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  <!-- Central sulcus hint, left + right (separates frontal from parietal) -->
  <path d="M -8,-18 C -28,-22 -52,-14 -68,2" stroke-opacity="0.25"/>
  <path d="M 8,-18 C 28,-22 52,-14 68,2" stroke-opacity="0.25"/>
  <!-- Lateral sulcus (Sylvian fissure) hint -->
  <path d="M -78,8 C -68,18 -56,22 -44,20" stroke-opacity="0.2"/>
  <path d="M 78,8 C 68,18 56,22 44,20" stroke-opacity="0.2"/>
  <!-- Cerebellum hint at the back -->
  <path d="M -40,72 C -20,86 20,86 40,72" stroke-opacity="0.25"/>
</svg>
