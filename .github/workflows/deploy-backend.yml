name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login
  contents: read

env:
  IMAGE_NAME: cortexks-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ${IMAGE_NAME}:${{ github.sha }} \
            --image ${IMAGE_NAME}:latest \
            --no-logs \
            ./backend

      - name: Update Container App with new revision
        run: |
          REV_SUFFIX="ci$(date +%s)"
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }} \
            --revision-suffix "${REV_SUFFIX}"

      - name: Run alembic migrations against live DB
        run: |
          # `az containerapp exec` runs inside the new revision's primary replica
          az containerapp exec \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --command "alembic upgrade head"

      - name: Verify health endpoint
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Backend URL: https://${FQDN}"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt ${i}/12: HTTP ${STATUS} — retrying in 5s"
            sleep 5
          done
          echo "Health check did not pass within 60s"
          exit 1
